<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    <style>
        body {
            font-size: 16px;
            line-height: 1.5;
        }
        @media (min-width: 480px) {
            body {
                font-size: 18px;
            }
        }
        @media (min-width: 768px) {
            body {
                font-size: 20px;
            }
        }
        h1, h2, h3 {
            font-size: 1.5em;
        }
        button {
            font-size: 1em;
            padding: 10px 15px;
        }
    </style>
</head>
<body>
    <h1>Welcome to Imran Driving School</h1>
    <p>Learn to drive with confidence!</p>
    <button>Get Started</button>
</body>
</html>
